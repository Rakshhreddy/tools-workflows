<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How designers actually work with AI</title>
<meta name="description" content="What designers actually reach for when they work with AI, and how they move between tools. Every claim quoted from a full interview and timestamped.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://tools-workflows.vercel.app/">
<meta property="og:title" content="How designers actually work with AI">
<meta property="og:description" content="What designers actually reach for when they work with AI, and how they move between tools. Every claim quoted from a full interview and timestamped.">
<meta property="og:image" content="https://tools-workflows.vercel.app/assets/cover.png">
<meta property="og:image:width" content="1300">
<meta property="og:image:height" content="940">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="How designers actually work with AI">
<meta name="twitter:description" content="What designers actually reach for when they work with AI, and how they move between tools.">
<meta name="twitter:image" content="https://tools-workflows.vercel.app/assets/cover.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="head">
    <div class="head-row">
      <!-- The context line sits under the title, in the space the rail column
           was leaving empty. That reclaims the gap and makes the header's
           height depend on the rail alone, so it cannot change when you pick
           a company. -->
      <div class="head-left">
        <p class="lede">
          <span class="title">How designers actually work with AI.</span>
          <span class="sub">The tools they use and how they move between them. Pick a company to see one workflow.</span>
        </p>
        <p class="mode" id="mode"></p>
      </div>
      <div class="rails">
        <div class="find">
          <input class="find-input" id="find" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Search a company or designer" aria-label="Search companies and designers"
                 aria-expanded="false" aria-controls="findResults" role="combobox">
          <kbd class="find-key" aria-hidden="true">&#8984;K</kbd>
          <div class="find-results" id="findResults" role="listbox" hidden></div>
        </div>
        <!-- Rail scrolls rather than wraps, so the header holds its shape as
             companies are added. Arrows stay hidden until it actually overflows. -->
        <div class="who-rail">
          <button class="rail-arrow" id="railPrev" type="button" aria-label="Previous companies" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>
          </button>
          <div class="who-scroll" id="whoScroll"><div class="who" id="who"></div></div>
          <button class="rail-arrow" id="railNext" type="button" aria-label="More companies" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg>
          </button>
        </div>
        <div class="who-sub" id="whoSub"></div>
      </div>
    </div>
  </header>

  <main class="canvas-wrap" id="canvasWrap">
    <svg id="graph" role="img" aria-label="Design tools grouped by workflow stage, with lines showing how designers move between them">
      <title>Designer tool landscape</title>
    </svg>
    <div class="tip" id="tip" hidden></div>
  </main>

  <!-- The bottom rail is the quiet half of the interface: what the corpus
       shows, and where it came from. Both open in the same panel. -->
  <footer class="foot">
    <div class="findings" id="findings"></div>
    <button class="foot-link" id="sourcesBtn" type="button">Sources</button>
  </footer>
</div>

<div class="panel-backdrop" id="panelBackdrop" hidden>
  <aside class="panel" id="panel" role="dialog" aria-label="Tool detail">
    <button class="panel-close" id="panelClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <div class="panel-inner" id="panelBody"></div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
