<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How designers actually work with AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="head">
    <div class="head-row">
      <p class="lede">
        <span class="title">How designers actually work with AI.</span>
        <span class="sub">The tools they use and how they move between them. Pick a company to see one workflow.</span>
      </p>
      <div class="rails">
        <div class="who" id="who"></div>
        <div class="who-sub" id="whoSub"></div>
      </div>
    </div>
    <div class="head-bottom">
      <div class="stage-dots" aria-hidden="true">
        <span class="stage-dot" style="--i:0"></span>
        <span class="stage-dot" style="--i:1"></span>
        <span class="stage-dot" style="--i:2"></span>
        <span class="stage-dot" style="--i:3"></span>
        <span class="stage-dot" style="--i:4"></span>
      </div>
      <p class="mode" id="mode"></p>
    </div>
  </header>

  <main class="canvas-wrap" id="canvasWrap">
    <svg id="graph" role="img" aria-label="Design tools grouped by workflow stage, with lines showing how designers move between them">
      <title>Designer tool landscape</title>
    </svg>
    <div class="tip" id="tip" hidden></div>
  </main>

  <footer class="foot" id="footNote"></footer>
</div>

<div class="panel-backdrop" id="panelBackdrop" hidden>
  <aside class="panel" id="panel" role="dialog" aria-label="Tool detail">
    <button class="panel-close" id="panelClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <div class="panel-inner" id="panelBody"></div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
