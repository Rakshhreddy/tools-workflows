<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How designers actually work with AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="head">
    <div class="head-row">
      <p class="lede">
        <span class="title">How designers actually work with AI.</span>
        <span class="sub">The tools they use and how they move between them. Pick a company to see one workflow.</span>
      </p>
      <div class="rails">
        <div class="who" id="who"></div>
        <div class="who-sub" id="whoSub"></div>
      </div>
      <button class="palette-trigger micro" id="paletteTrigger" aria-label="Search tools, designers, companies">Cmd+K</button>
    </div>
    <p class="mode" id="mode"></p>
  </header>

  <main class="canvas-wrap" id="canvasWrap">
    <svg id="graph" role="img" aria-label="Design tools grouped by workflow stage, with lines showing how designers move between them">
      <title>Designer tool landscape</title>
    </svg>
    <div class="tip" id="tip" hidden></div>
  </main>

  <footer class="foot" id="footNote"></footer>
</div>

<div class="palette-overlay" id="paletteOverlay" hidden>
  <div class="palette" role="dialog" aria-label="Quick navigation">
    <div class="palette-input-wrap">
      <svg class="palette-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="palette-input" id="paletteInput" type="text" placeholder="Search tools, designers, companies..." autocomplete="off" spellcheck="false">
      <kbd class="palette-esc">ESC</kbd>
    </div>
    <div class="palette-results" id="paletteResults" role="listbox"></div>
    <div class="palette-footer micro">
      <span><span class="key">↑↓</span> Navigate</span>
      <span><span class="key">Enter</span> Select</span>
      <span><span class="key">Esc</span> Close</span>
    </div>
  </div>
</div>

<aside class="panel" id="panel" hidden>
  <button class="panel-close" id="panelClose" aria-label="Close">&times;</button>
  <div id="panelBody"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
